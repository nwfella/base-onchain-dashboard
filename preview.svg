      <stop offset="0%" style="stop-color:#0A0B0D"/>
      <stop offset="100%" style="stop-color:#12141A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052FF"/>
      <stop offset="50%" style="stop-color:#4D8AFF"/>
      <stop offset="100%" style="stop-color:#00C853"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="40" y="40" width="1200" height="560" rx="24" fill="#1A1D28" stroke="#2A2E3E" stroke-width="1"/>
  
  <!-- Header bar -->
  <rect x="40" y="40" width="1200" height="60" rx="24" fill="#12141A" stroke="#2A2E3E" stroke-width="1"/>
