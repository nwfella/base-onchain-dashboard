  <text x="375" y="180" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" fill="#E8EAF0">46,970K</text>
  
  <rect x="630" y="120" width="250" height="80" rx="12" fill="rgba(255,255,255,0.03)" stroke="#2A2E3E" stroke-width="1"/>
