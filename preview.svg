  <text x="500" y="289" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#E8EAF0">$1.2B</text>
  
  <line x1="105" y1="305" x2="590" y2="305" stroke="#2A2E3E" stroke-width="1"/>
