  <rect x="635" y="225" width="530" height="200" rx="12" fill="rgba(255,255,255,0.02)" stroke="#2A2E3E" stroke-width="1"/>
  <text x="660" y="255" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#888D9B" letter-spacing="1">RECENT BLOCKS</text>
  
  <text x="660" y="285" font-family="JetBrains Mono, monospace" font-size="13" fill="#4D8AFF">#46,970,322</text>
  <text x="780" y="285" font-family="Inter, sans-serif" font-size="13" fill="#888D9B">2s ago</text>
  <text x="880" y="285" font-family="Inter, sans-serif" font-size="13" fill="#888D9B">3 txns</text>
  
  <line x1="660" y1="298" x2="1145" y2="298" stroke="#2A2E3E" stroke-width="1"/>
  <text x="660" y="318" font-family="JetBrains Mono, monospace" font-size="13" fill="#4D8AFF">#46,970,321</text>
  <text x="780" y="318" font-family="Inter, sans-serif" font-size="13" fill="#888D9B">4s ago</text>
  <text x="880" y="318" font-family="Inter, sans-serif" font-size="13" fill="#888D9B">1 txn</text>
  
  <!-- NFT mint button CTA -->
  <rect x="80" y="450" width="1080" height="60" rx="30" fill="url(#accent)" opacity="0.9"/>
  <text x="620" y="487" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">⚡ Connect Wallet &amp; Mint Your Base Explorer Badge</text>
  
  <!-- Footer -->
  <text x="640" y="560" font-family="Inter, sans-serif" font-size="13" fill="#888D9B" text-anchor="middle">Built on Base · Data from DeFiLlama, CoinGecko &amp; Base RPC</text>
